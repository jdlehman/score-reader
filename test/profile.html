<meta charset="utf-8">
<title>Score Reader: one page, for profiling</title>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<div id="display" style="width:320px;height:200px"></div>
<pre id="log"></pre>
<script type="module">
// Audiveris's command line on one image, with the jars as built in .work/ (test/profile.mjs drives it).
//   ?page=/.work/page.png    ?fast=0: the jars as released, without FastMath
const params = new URLSearchParams(location.search)
const page = params.get('page') ?? '/.work/page.png'
const t0 = performance.now()
const log = (...a) => {
  const s = `${((performance.now() - t0) / 1000).toFixed(1)} s ${a.join(' ')}`
  document.getElementById('log').textContent += s + '\n'
  console.log('[profile]', s)
}
let finished
const done = new Promise(r => { finished = r })
try {
  await cheerpjInit({
    version: 25,
    status: 'none',
    env: ['HOME=/files/home', 'XDG_CONFIG_HOME=/files/home/config', 'XDG_DATA_HOME=/files/home/data', 'XDG_CACHE_HOME=/files/home/cache'],
    // as app/reader.js sets them, which explains each
    javaProperties: ['file.encoding=UTF-8', 'java.awt.headless=true', 'sun.java2d.uiScale=1', 'com.sun.media.jai.disableMediaLib=true', 'sun.font.layout.ffm=false', 'scorereader.keepSheets=true', 'scorereader.inBrowser=true'],
    natives: {
      async Java_org_audiveris_omr_ScoreReaderHook_finished(lib, failure) {
        finished(!!failure)
        return new Promise(() => {}) // park Audiveris for good
      },
    },
  })
  cheerpjCreateDisplay(320, 200, document.getElementById('display'))
  log('cheerpj ready')
  const name = page.split('/').pop()
  cheerpOSAddStringFile('/str/' + name, new Uint8Array(await (await fetch(page)).arrayBuffer()))
  const classpath = params.get('fast') === '0'
    ? '/app/.work/patched.jar:' + (await (await fetch('/.work/classpath.txt')).text()).trim()
    : (await (await fetch('/.work/classpath-fast.txt')).text()).trim()
  cheerpjRunMain('Audiveris', classpath, '-batch', '-constant', 'org.audiveris.omr.text.tesseract.TesseractOCR.useOCR=false', '-constant', 'org.audiveris.omr.Main.sheetStepTimeOut=3600', '-transcribe', '-export', '-output', '/files/out', '/str/' + name)
    .then(code => finished(code !== 0))
  log('audiveris finished' + ((await done) ? ' with a failure' : ''))
} catch (e) {
  log('error', String(e && (e.stack || e)))
}
</script>
