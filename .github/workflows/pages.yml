# Build the site from Audiveris's release, our patches and PDF.js, and publish it on GitHub Pages.
# Uses no secrets. The build job can only read the repository; only the deploy job, which runs no
# code of ours or of npm's, may publish.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Audiveris's source and release jars, the JDK and the libraries' source: about 300 MB to fetch otherwise
      - uses: actions/cache@v4
        with:
          path: |
            .work/audiveris
            .work/lib
            .work/jdk
            .work/sources
          key: work-${{ hashFiles('setup.sh', 'patches/**') }}
      - run: ./setup.sh
      # only PDF.js is needed to build, and none of the packages' install scripts
      - run: npm ci --omit=dev --ignore-scripts
      - run: ./build.sh
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
