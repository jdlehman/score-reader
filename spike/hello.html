<!doctype html>
<meta charset="utf-8">
<title>CheerpJ check</title>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<script type="module">
// ?java=25&wasm=1 : does a tiny program run, and how fast?
const params = new URLSearchParams(location.search)
window.spike = { done: false }
try {
  await cheerpjInit({ wasmGC: params.get('wasm') === '1', version: Number(params.get('java') ?? 25), status: 'none', natives: { Java_Hello_jsSqrt(lib, x) { return Math.sqrt(x) } } })
  const code = await cheerpjRunMain('Hello', '/app/.work/hello/hello.jar', 'time')
  console.log('[spike] exited ' + code)
} catch (e) { console.log('[spike] error ' + (e.stack || e)) }
window.spike.done = true
</script>
